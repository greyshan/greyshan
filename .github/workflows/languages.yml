name: Generate Language Card

on:
  schedule:
    - cron: "15 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - name: Build language card
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          EXCLUDE: "Jupyter Notebook"
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          from xml.sax.saxutils import escape

          TOKEN = os.environ.get("GH_TOKEN", "")
          EXCLUDE = {x.strip().lower() for x in os.environ.get("EXCLUDE", "").split(",") if x.strip()}

          def api(path):
              req = urllib.request.Request("https://api.github.com" + path, headers={
                  "Authorization": "Bearer " + TOKEN, "Accept": "application/vnd.github+json",
                  "User-Agent": "lang-card", "X-GitHub-Api-Version": "2022-11-28"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  print("GitHub API error: HTTP", e.code)   # no repo names are ever printed
                  sys.exit(1)

          def collect():
              totals, page = {}, 1
              while True:
                  repos = api(f"/user/repos?affiliation=owner&per_page=100&page={page}")
                  if not repos: break
                  for r in repos:
                      if r.get("fork"): continue
                      for lang, n in api(f"/repos/{r['full_name']}/languages").items():
                          if lang.lower() in EXCLUDE: continue
                          totals[lang] = totals.get(lang, 0) + n
                  page += 1
              return totals

          def render(totals):
              BG, BORDER, INK, MUTED, TRACK = "#F5F0E6", "#9CAF88", "#2F3A2F", "#6B7A63", "#E2DAC4"
              FILLS = ["#4F6F52", "#6F8F5F", "#8AA67A", "#9CAF88", "#B5C4A2"]
              top = sorted(totals.items(), key=lambda kv: -kv[1])[:5]
              total = sum(totals.values()) or 1
              W, H = 495, 165
              o = [f'<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}" font-family="Fira Code, ui-monospace, Menlo, Consolas, monospace">',
                   f'<rect x="1.5" y="1.5" width="{W-3}" height="{H-3}" rx="10" fill="{BG}" stroke="{BORDER}" stroke-width="3"/>',
                   f'<text x="26" y="34" font-size="16" font-weight="700" fill="#4F6F52">Most Used Languages</text>']
              for i, (lang, n) in enumerate(top):
                  y = 58 + i * 20
                  pct = n * 100 / total
                  o.append(f'<text x="26" y="{y+9}" font-size="12" fill="{INK}">{escape(lang)}</text>')
                  o.append(f'<rect x="140" y="{y}" width="260" height="9" rx="4.5" fill="{TRACK}"/>')
                  o.append(f'<rect x="140" y="{y}" width="{max(260*pct/100, 6):.1f}" height="9" rx="4.5" fill="{FILLS[i]}"/>')
                  o.append(f'<text x="{W-26}" y="{y+9}" font-size="12" text-anchor="end" fill="{MUTED}">{pct:.1f}%</text>')
              o.append('</svg>')
              return "\n".join(o)

          if __name__ == "__main__":
              if not TOKEN:
                  print("Missing GH_STATS_TOKEN secret"); sys.exit(1)
              totals = collect()
              if not totals:
                  print("No language data found"); sys.exit(1)
              os.makedirs("dist", exist_ok=True)
              open("dist/languages.svg", "w").write(render(totals))
              print("done")
          PY

      - name: Publish to stats branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: stats
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
